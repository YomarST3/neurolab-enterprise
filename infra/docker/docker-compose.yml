version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: neurolab_postgres
    environment:
      POSTGRES_USER: neurolab_user
      POSTGRES_PASSWORD: neurolab_password_2026
      POSTGRES_DB: neurolab_enterprise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurolab_user -d neurolab_enterprise"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: neurolab_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://neurolab_user:neurolab_password_2026@postgres:5432/neurolab_enterprise
      HOST: "0.0.0.0"
      PORT: 8000
    ports:
      - "8000:8000"

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    container_name: neurolab_web
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  postgres_data:
